<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/login.css">
</head>
<body>

<div class="login-bg">
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>
</div>

<div class="login-wrapper">
  <div class="login-container">

    <div class="logo-section">
      <img src="Woodmark.svg" alt="LiMon Logo" class="logo-img">
      <div class="logo-sub">Library Monitoring System</div>
    </div>

    <div class="login-card">
      <div class="card-header">
        <h2>Welcome back</h2>
      </div>

      <div class="login-form">
        <div class="form-group">
          <label for="User ID">Staff ID</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input type="text" id="User ID" placeholder="Enter your Staff  ID">
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input type="password" id="password" placeholder="Enter your password">
          </div>
        </div>

        <div class="form-footer">
          <label class="checkbox-wrapper">
            <input type="checkbox">
            <span class="checkbox-custom"></span>
            <span class="checkbox-label">Remember me</span>
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <a href="/home" style="text-decoration: none">
          <button class="btn-primary">
            Sign In
          </button>
        </a>
      </div>
    </div>

    <div class="login-footer">
      <p>Camarines Sur Polytechnic Colleges</p>
    </div>

  </div>
</div>

</body>
</html>
